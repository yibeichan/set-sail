name: Refresh job feed

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public RSS feeds
        run: node scripts/update-jobs.mjs
      - name: Commit changed jobs only
        run: |
          git config user.name 'signal-desk-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh job feed"
            git push
          fi
