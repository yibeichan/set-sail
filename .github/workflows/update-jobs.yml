name: Refresh job feed

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch public RSS feeds
        run: node scripts/update-jobs.mjs
      - name: Commit changed jobs only
        run: |
          git config user.name 'signal-desk-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh job feed"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yibeichan/set-sail.git" HEAD:main
          fi
